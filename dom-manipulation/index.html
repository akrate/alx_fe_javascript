<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dynamic Quote Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f4f4f4;
      text-align: center;
    }

    #quoteDisplay {
      margin: 20px auto;
      padding: 20px;
      width: 60%;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    input, select, button {
      padding: 10px;
      margin: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
    }

    button:hover {
      background-color: #45a049;
    }

    .form-container {
      margin-top: 30px;
    }

    #notification {
      margin-top: 15px;
      color: #d9534f;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Dynamic Quote Generator</h1>

  <!-- فلتر التصنيفات -->
  <label for="categoryFilter"><strong>Filter by Category:</strong></label>
  <select id="categoryFilter" onchange="filterQuotes()">
    <option value="all">All Categories</option>
  </select>

  <div id="quoteDisplay">Click the button to display a quote.</div>

  <button id="newQuote">Show New Quote</button>

  <!-- النموذج لإضافة اقتباسات -->
  
  <div class="form-container" id="addQuoteForm">
    <input id="newQuoteText" type="text" placeholder="Enter a new quote" />
    <input id="newQuoteCategory" type="text" placeholder="Enter quote category" />
    <button onclick="addQuote()">Add Quote</button>
  </div>

  <div style="margin-top: 30px;">
    <h3>Import / Export JSON</h3>
    <input type="file" id="importFile" accept=".json" onchange="importFromJsonFile(event)" />
    <button onclick="exportToJson()">Export Quotes</button>
  </div>

  <div id="notification"></div>

  <script src="script.js"></script>
</body>
</html>
